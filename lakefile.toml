name = "bent_partition_depth"
version = "1.0.0"
keywords = ["math", "lean", "bent-functions"]
defaultTargets = ["BentPartitionDepth"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "BentPartitionDepth"
